<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
    .small-text { font-family: Arial, sans-serif; font-size: 14px; }
  </style>
  
  <!-- Círculo de fundo -->
  <circle cx="40" cy="40" r="30" fill="#E65C00"/>
  
  <!-- Texto "SGE" -->
  <text x="90" y="48" class="logo-text" fill="#E65C00" font-size="36">SGE</text>
  
  <!-- Texto descritivo -->
  <text x="90" y="65" class="small-text" fill="#CC5200" font-size="14">Sistema de Gestão Escolar</text>
  
  <!-- Ícone dentro do círculo -->
  <path d="M30 30 L50 30 L50 50 L30 50 Z" fill="white" />
  <path d="M35 35 L45 35 L45 45 L35 45 Z" fill="#E65C00" />
</svg> 