<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fundo do calendário -->
  <rect x="100" y="100" width="600" height="400" rx="15" ry="15" fill="#fff" stroke="#4e73df" stroke-width="5"/>
  
  <!-- Cabeçalho do calendário -->
  <rect x="100" y="100" width="600" height="80" rx="15" ry="15" fill="#4e73df"/>
  <text x="400" y="150" font-family="Arial" font-size="30" fill="#fff" text-anchor="middle">Calendário Acadêmico</text>
  
  <!-- Dias da semana -->
  <text x="185" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Seg</text>
  <text x="270" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Ter</text>
  <text x="355" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Qua</text>
  <text x="440" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Qui</text>
  <text x="525" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Sex</text>
  <text x="610" y="210" font-family="Arial" font-size="16" fill="#858796" text-anchor="middle">Sáb</text>
  
  <!-- Grades do calendário -->
  <line x1="100" y1="220" x2="700" y2="220" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="100" y1="270" x2="700" y2="270" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="100" y1="370" x2="700" y2="370" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="100" y1="420" x2="700" y2="420" stroke="#e3e6f0" stroke-width="1"/>
  
  <line x1="142" y1="220" x2="142" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="227" y1="220" x2="227" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="312" y1="220" x2="312" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="397" y1="220" x2="397" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="482" y1="220" x2="482" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="567" y1="220" x2="567" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  <line x1="652" y1="220" x2="652" y2="500" stroke="#e3e6f0" stroke-width="1"/>
  
  <!-- Números do calendário -->
  <text x="120" y="250" font-family="Arial" font-size="18" fill="#5a5c69">1</text>
  <text x="205" y="250" font-family="Arial" font-size="18" fill="#5a5c69">2</text>
  <text x="290" y="250" font-family="Arial" font-size="18" fill="#5a5c69">3</text>
  <text x="375" y="250" font-family="Arial" font-size="18" fill="#5a5c69">4</text>
  <text x="460" y="250" font-family="Arial" font-size="18" fill="#5a5c69">5</text>
  <text x="545" y="250" font-family="Arial" font-size="18" fill="#5a5c69">6</text>
  <text x="630" y="250" font-family="Arial" font-size="18" fill="#5a5c69">7</text>
  
  <text x="120" y="300" font-family="Arial" font-size="18" fill="#5a5c69">8</text>
  <text x="205" y="300" font-family="Arial" font-size="18" fill="#5a5c69">9</text>
  <text x="290" y="300" font-family="Arial" font-size="18" fill="#5a5c69">10</text>
  <text x="375" y="300" font-family="Arial" font-size="18" fill="#5a5c69">11</text>
  <text x="460" y="300" font-family="Arial" font-size="18" fill="#5a5c69">12</text>
  <text x="545" y="300" font-family="Arial" font-size="18" fill="#5a5c69">13</text>
  <text x="630" y="300" font-family="Arial" font-size="18" fill="#5a5c69">14</text>
  
  <text x="120" y="350" font-family="Arial" font-size="18" fill="#5a5c69">15</text>
  <text x="205" y="350" font-family="Arial" font-size="18" fill="#5a5c69">16</text>
  <text x="290" y="350" font-family="Arial" font-size="18" fill="#5a5c69">17</text>
  <text x="375" y="350" font-family="Arial" font-size="18" fill="#5a5c69">18</text>
  <text x="460" y="350" font-family="Arial" font-size="18" fill="#5a5c69">19</text>
  <text x="545" y="350" font-family="Arial" font-size="18" fill="#5a5c69">20</text>
  <text x="630" y="350" font-family="Arial" font-size="18" fill="#5a5c69">21</text>
  
  <text x="120" y="400" font-family="Arial" font-size="18" fill="#5a5c69">22</text>
  <text x="205" y="400" font-family="Arial" font-size="18" fill="#5a5c69">23</text>
  <text x="290" y="400" font-family="Arial" font-size="18" fill="#5a5c69">24</text>
  <text x="375" y="400" font-family="Arial" font-size="18" fill="#5a5c69">25</text>
  <text x="460" y="400" font-family="Arial" font-size="18" fill="#5a5c69">26</text>
  <text x="545" y="400" font-family="Arial" font-size="18" fill="#5a5c69">27</text>
  <text x="630" y="400" font-family="Arial" font-size="18" fill="#5a5c69">28</text>
  
  <text x="120" y="450" font-family="Arial" font-size="18" fill="#5a5c69">29</text>
  <text x="205" y="450" font-family="Arial" font-size="18" fill="#5a5c69">30</text>
  <text x="290" y="450" font-family="Arial" font-size="18" fill="#5a5c69">31</text>
  
  <!-- Destaque para um dia com evento -->
  <circle cx="375" cy="350" r="20" fill="#f6c23e" opacity="0.7"/>
  <circle cx="545" cy="300" r="20" fill="#1cc88a" opacity="0.7"/>
  <circle cx="290" cy="400" r="20" fill="#e74a3b" opacity="0.7"/>
  
  <!-- Legenda -->
  <circle cx="150" cy="500" r="10" fill="#f6c23e" opacity="0.7"/>
  <text x="170" y="505" font-family="Arial" font-size="14" fill="#5a5c69">Prova</text>
  
  <circle cx="250" cy="500" r="10" fill="#1cc88a" opacity="0.7"/>
  <text x="270" y="505" font-family="Arial" font-size="14" fill="#5a5c69">Atividade</text>
  
  <circle cx="370" cy="500" r="10" fill="#e74a3b" opacity="0.7"/>
  <text x="390" y="505" font-family="Arial" font-size="14" fill="#5a5c69">Evento</text>
</svg> 